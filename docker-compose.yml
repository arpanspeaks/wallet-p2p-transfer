services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: paytm_wallet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d paytm_wallet"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/paytm_wallet
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["8080:8080"]
volumes:
  postgres-data:
